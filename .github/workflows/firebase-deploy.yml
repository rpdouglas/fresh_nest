name: Deploy to Production
# Deploys only the areas that changed in the push (ADR-013).
# No npm audit here (ADR-014): PRs audit, and security-audit.yml checks daily, so a new advisory
# never holds back an unrelated fix.
# Run manually (workflow_dispatch) to force a full deploy of everything.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two production deploys at once; queue instead of cancelling mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # A manual run deploys everything; a push deploys what changed since the previous push.
      customer: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.customer == 'true' }}
      fsm: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.fsm == 'true' }}
      functions: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.functions == 'true' }}
      rules: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rules == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          # Keep the area paths in sync with firebase-preview.yml. A change to this workflow deploys everything.
          filters: |
            ci: &ci
              - '.github/workflows/firebase-deploy.yml'
            shared: &shared
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
            customer:
              - *ci
              - *shared
              - 'apps/customer/**'
              - 'firebase.json'
            fsm:
              - *ci
              - *shared
              - 'apps/fsm/**'
              - 'firebase.json'
            functions:
              - *ci
              - *shared
              - 'functions/**'
              - 'firebase.json'
            rules:
              - *ci
              - 'firestore.rules'
              - 'firestore.dev.rules'
              - 'firestore.indexes.json'
              - 'storage.rules'
              - 'firebase.json'

  # Security rules & indexes deploy after passing the Firestore + Storage emulator test suite (ADR-018).
  rules:
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - name: Firestore and Storage rules tests (emulator)
        working-directory: apps/customer
        run: npx -y firebase-tools@15 emulators:exec --only firestore,storage --project freshnest-aa51e "npx vitest run --config vitest.rules.config.ts"
      - name: Deploy Firestore & Storage Rules and Indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$SA_FILE"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          npx -y firebase-tools@15 deploy --only storage,firestore:rules,firestore:indexes --project freshnest-aa51e --non-interactive

  # Functions deploy before hosting so new clients never call a callable that isn't live yet.
  functions:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      # Root install provides Vitest for the functions tests.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Deploy Cloud Functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$SA_FILE"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA_FILE"
          npx -y firebase-tools@15 deploy --only functions --project freshnest-aa51e --non-interactive

  customer:
    needs: [changes, functions]
    # Runs after functions when both changed; skips if the functions deploy failed.
    if: ${{ !cancelled() && needs.changes.outputs.customer == 'true' && needs.functions.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions: { checks: write, contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Unit tests
        run: npm run test:customer
      - name: Build (prod DB)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DB_ID: "(default)"
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build:customer
      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            npx @sentry/cli releases new "$GITHUB_SHA"
            npx @sentry/cli releases files "$GITHUB_SHA" upload-sourcemaps apps/customer/dist --url-prefix '~/'
            npx @sentry/cli releases finalize "$GITHUB_SHA"
          else
            echo "SENTRY_AUTH_TOKEN not set — skipping source map upload"
          fi
      - name: Deploy Customer Portal
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: freshnest-aa51e
          channelId: live
          target: freshnest-prod

  fsm:
    needs: [changes, functions]
    if: ${{ !cancelled() && needs.changes.outputs.fsm == 'true' && needs.functions.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions: { checks: write, contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Unit tests
        run: npm run test:fsm
      - name: Build (prod DB)
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIRESTORE_DB_ID: "(default)"
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        run: npm run build:fsm
      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            npx @sentry/cli releases new "$GITHUB_SHA"
            npx @sentry/cli releases files "$GITHUB_SHA" upload-sourcemaps apps/fsm/dist --url-prefix '~/'
            npx @sentry/cli releases finalize "$GITHUB_SHA"
          else
            echo "SENTRY_AUTH_TOKEN not set — skipping source map upload"
          fi
      - name: Deploy FSM Portal
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: freshnest-aa51e
          channelId: live
          target: freshnest-fsm
