name: Security Audit (daily)
# Production-dependency audit outside the deploy path (ADR-014). PRs still audit the areas they
# change; this catches advisories published after merge and opens (or updates) one issue,
# instead of blocking the next production deploy.
on:
  schedule:
    - cron: '41 6 * * *' # daily 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Audit production dependencies
        id: audit
        run: |
          status=0
          for dir in . functions; do
            echo "### npm audit — $dir" >> report.md
            echo '```' >> report.md
            if ! (cd "$dir" && npm audit --omit=dev --audit-level=high) >> report.md 2>&1; then
              status=1
            fi
            echo '```' >> report.md
          done
          echo "failed=$status" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the audit issue
        if: steps.audit.outputs.failed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Production dependency audit failing'
        run: |
          {
            echo "The daily \`npm audit --omit=dev --audit-level=high\` found high or critical advisories."
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Usually fixed with \`npm audit fix\` in the affected directory (lockfile only). Deploys are not blocked (ADR-014)."
            echo
            head -c 60000 report.md
          } > body.md
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi
      - name: Fail the run so it shows red
        if: steps.audit.outputs.failed == '1'
        run: exit 1
