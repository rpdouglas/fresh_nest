name: Docs Check
on:
  # main only: on PR branches the pull_request run already covers each push (ADR-014).
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'user-guide/**'
      - '*.md'
  pull_request:
    paths:
      - 'docs/**'
      - 'user-guide/**'
      - '*.md'

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.mlc-config.json'
          folder-path: 'docs, user-guide'
          file-extension: '.md'
