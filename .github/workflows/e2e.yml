name: E2E (weekly)
# Playwright persona flows, weekly and on demand, on the Firebase emulators (ADR-019). The same suite
# also runs on PRs (firebase-preview.yml) during the two-week trial. No Firebase secrets needed.
on:
  schedule:
    - cron: '17 9 * * 1' # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - name: Install functions dependencies (the seed uses firebase-admin)
        run: npm ci
        working-directory: functions
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/customer
      - name: E2E tests (Playwright on emulators)
        run: npm run test:e2e
        working-directory: apps/customer
        env:
          CI: true
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: apps/customer/test-results/
          retention-days: 7
