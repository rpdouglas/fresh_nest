name: Deploy Preview Channel
# PR checks + Firebase preview channels (ADR-004, path filtering per ADR-013, gates per ADR-014).
# Each area only builds, tests and previews when its files change.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# A newer push to the same PR supersedes the running checks.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Preview builds always target the dev Firestore database.
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_FIRESTORE_DB_ID: freshnest-dev

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    outputs:
      customer: ${{ steps.filter.outputs.customer }}
      fsm: ${{ steps.filter.outputs.fsm }}
      functions: ${{ steps.filter.outputs.functions }}
      rules: ${{ steps.filter.outputs.rules }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A change to this workflow runs everything; shared code and the root lockfile affect both apps.
          # Keep the area paths in sync with firebase-deploy.yml.
          filters: |
            ci: &ci
              - '.github/workflows/firebase-preview.yml'
            shared: &shared
              - 'packages/shared/**'
              - 'package.json'
              - 'package-lock.json'
            customer:
              - *ci
              - *shared
              - 'apps/customer/**'
              - 'firebase.json'
            fsm:
              - *ci
              - *shared
              - 'apps/fsm/**'
              - 'firebase.json'
            functions:
              - *ci
              - 'functions/**'
              - 'firebase.json'
            rules:
              - *ci
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - 'storage.rules'
              - 'apps/customer/test/**'
              - 'apps/customer/vitest.rules.config.ts'

  customer:
    needs: changes
    if: needs.changes.outputs.customer == 'true'
    runs-on: ubuntu-latest
    permissions: { checks: write, contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm --workspace=apps/customer run lint
      - name: Unit tests
        run: npm run test:customer
      - name: Build (dev DB)
        run: npm run build:customer
      # Dependabot PRs have no access to Actions secrets, so they can't deploy previews.
      - name: Deploy customer preview
        id: deploy
        if: github.actor != 'dependabot[bot]'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: freshnest-aa51e
          target: freshnest-dev
          expires: 7d
      - name: Lighthouse (informational)
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ steps.deploy.outputs.details_url }}
            ${{ steps.deploy.outputs.details_url }}/booking
          uploadArtifacts: true
          temporaryPublicStorage: true

  fsm:
    needs: changes
    if: needs.changes.outputs.fsm == 'true'
    runs-on: ubuntu-latest
    permissions: { checks: write, contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm --workspace=apps/fsm run lint
      - name: Unit tests
        run: npm run test:fsm
      - name: Build (dev DB)
        run: npm run build:fsm
      - name: Deploy FSM preview
        if: github.actor != 'dependabot[bot]'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: freshnest-aa51e
          target: freshnest-fsm
          expires: 7d

  # Functions are validated on PRs but only deployed from main (one live instance per project).
  functions:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      # Root install provides Vitest for the functions tests.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test

  # Firestore and Storage security rules tests on the emulator — only when the rules or their tests change.
  # (Rules are still never deployed by CI — COMPLIANCE.md §4.) E2E runs weekly in e2e.yml (ADR-014).
  rules:
    needs: changes
    if: needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm ci
      - name: Firestore and Storage rules tests (emulator)
        working-directory: apps/customer
        run: npx -y firebase-tools@15 emulators:exec --only firestore,storage --project freshnest-aa51e "npx vitest run --config vitest.rules.config.ts"
