version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/apps/customer"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "customer-app"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/apps/fsm"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "fsm-app"]
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "functions"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "github-actions"]
